<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b11">
<title>PocketPanel</title>
<style>
:root{
  --bg:#080b11;--bg-soft:#0c1118;--card:#101722;--card-2:#151e2b;--card-3:#1a2434;
  --line:#1e2a3a;--line-2:#2a3a50;--txt:#e7eef9;--txt-2:#93a4bd;--txt-3:#5f7089;
  --brand:#4d8dff;--brand-soft:rgba(77,141,255,.13);--ok:#22c55e;--ok-soft:rgba(34,197,94,.12);
  --warn:#f5a623;--warn-soft:rgba(245,166,35,.12);--danger:#f05252;--danger-soft:rgba(240,82,82,.12);
  --topbar:rgba(8,11,17,.82);--shadow:0 10px 30px rgba(0,0,0,.4);--code:#04070c;--code-fg:#b8c6d8;
}
[data-theme="light"]{
  --bg:#f3f6fb;--bg-soft:#eef2f8;--card:#ffffff;--card-2:#f6f9fd;--card-3:#eef2f7;
  --line:#e3e9f2;--line-2:#d3dce8;--txt:#0e1726;--txt-2:#5a6b82;--txt-3:#76879d;
  --brand-soft:rgba(77,141,255,.10);--topbar:rgba(255,255,255,.85);--shadow:0 8px 24px rgba(16,38,72,.1);
  --code:#111827;--code-fg:#d1d9e6;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC",Roboto,sans-serif;
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--brand);text-decoration:none}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.dim{color:var(--txt-3)}
.muted{color:var(--txt-2)}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.spacer{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}

#login{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(700px 400px at 70% 10%,rgba(77,141,255,.12),transparent 60%),var(--bg);z-index:10}
.login-card{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:26px 22px;box-shadow:var(--shadow)}
.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(140deg,#4d8dff,#22d3ee);
  display:grid;place-items:center;color:#05121f;font-weight:800;font-size:19px;margin-bottom:14px}
.login-card h1{font-size:19px;margin:0 0 4px;letter-spacing:-.3px}
.login-card p{margin:0 0 20px;font-size:12px;color:var(--txt-3)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12px;color:var(--txt-2)}
.input{height:38px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:var(--bg-soft);
  color:var(--txt);outline:none;width:100%}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.input{height:auto;padding:9px 11px;line-height:1.6;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 13px;
  border-radius:9px;border:1px solid var(--line);background:var(--card-2);color:var(--txt);cursor:pointer;
  font-size:13px;transition:.15s}
.btn:hover{border-color:var(--line-2)}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,#4d8dff,#3b7cf0);border-color:transparent;color:#fff;font-weight:600}
.btn.ghost{background:transparent;border-color:transparent;color:var(--txt-2)}
.btn.danger{background:var(--danger-soft);border-color:rgba(240,82,82,.3);color:var(--danger)}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:7px}
.btn.block{width:100%;height:38px}
.btn[disabled]{opacity:.5;pointer-events:none}
.err{color:var(--danger);font-size:12px;min-height:18px}

#app{display:none;min-height:100vh}
#app.on{display:flex}
.side{width:210px;flex:0 0 210px;position:fixed;top:0;bottom:0;left:0;z-index:30;
  background:linear-gradient(180deg,var(--bg-soft),var(--bg));border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:16px 10px 12px}
.brand{display:flex;align-items:center;gap:9px;padding:0 8px 16px}
.brand-logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(140deg,#4d8dff,#22d3ee);
  display:grid;place-items:center;color:#05121f;font-weight:800;font-size:14px}
.brand b{font-size:14px}
.brand span{display:block;font-size:10px;color:var(--txt-3)}
.nav{flex:1;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:9px;height:38px;padding:0 10px;border-radius:9px;
  color:var(--txt-2);cursor:pointer;font-size:13px;margin-bottom:2px;position:relative}
.nav-item:hover{background:var(--card-2);color:var(--txt)}
.nav-item.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav-item.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;
  border-radius:0 3px 3px 0;background:var(--brand)}
.nav-item svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;flex:0 0 16px}
.side-foot{border-top:1px solid var(--line);padding:10px 8px 0;font-size:11px;color:var(--txt-3)}
.who{display:flex;align-items:center;gap:8px;padding:8px;border-radius:9px;cursor:pointer;margin-bottom:6px}
.who:hover{background:var(--card-2)}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--brand-soft);color:var(--brand);
  display:grid;place-items:center;font-weight:700;font-size:12px;flex:0 0 26px;text-transform:uppercase}
.who b{display:block;font-size:12px;color:var(--txt);line-height:1.3}
.who span{font-size:10px;color:var(--txt-3)}
.main{margin-left:210px;flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:54px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:0 18px;
  background:var(--topbar);border-bottom:1px solid var(--line);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.top h1{font-size:15px;margin:0;font-weight:650}
.ico-btn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--card);
  display:grid;place-items:center;cursor:pointer;color:var(--txt-2);flex:0 0 32px}
.ico-btn:hover{color:var(--txt);border-color:var(--line-2)}
.ico-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9}
.content{padding:16px 18px 40px;max-width:1200px;width:100%;margin:0 auto;flex:1}
.page{display:none}
.page.on{display:block}

.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px}
.card h3{font-size:13px;margin:0 0 12px;font-weight:650;display:flex;align-items:center;gap:7px}
.card h3 span{margin-left:auto;font-size:11px;color:var(--txt-3);font-weight:400}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){
  .main{margin-left:0}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2{grid-template-columns:1fr}
  .content{padding:12px 12px 86px}
  .top{padding:0 12px;height:52px}
}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;
  background:var(--topbar);border-top:1px solid var(--line);
  padding:5px 4px calc(5px + env(safe-area-inset-bottom,0px));
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tabbar button{flex:1;border:0;background:transparent;color:var(--txt-3);display:flex;flex-direction:column;
  align-items:center;gap:2px;font-size:10px;padding:4px 0;cursor:pointer}
.tabbar button.on{color:var(--brand)}
.tabbar svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
@media(min-width:901px){.tabbar{display:none}}

/* 移动端侧栏改为抽屉 */
@media(max-width:900px){
  .side{width:246px;transform:translateX(-100%);transition:transform .22s;z-index:32;padding-top:22px}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.5)}
  #scrim{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(3,6,11,.6);z-index:31;display:none}
  #scrim.on{display:block}
  .nav-item{height:42px}
}
@media(min-width:901px){#scrim{display:none!important}}

.ring{--p:0;--c:var(--brand);width:52px;height:52px;border-radius:50%;flex:0 0 52px;
  background:var(--card-3);display:grid;place-items:center;position:relative}
@supports (background:conic-gradient(from 0deg,red,blue)){
  .ring{background:conic-gradient(var(--c) calc(var(--p)*1%),var(--card-3) 0)}
}
.ring::before{content:"";position:absolute;top:5px;right:5px;bottom:5px;left:5px;border-radius:50%;background:var(--card)}
.ring span{position:relative;font-size:12px;font-weight:700}
.metric{display:flex;align-items:center;gap:11px}
.metric .v{font-size:18px;font-weight:700;letter-spacing:-.4px}
.metric .l{font-size:11px;color:var(--txt-3)}
.bar{height:6px;border-radius:6px;background:var(--card-3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--brand);transition:width .4s}
.tag{display:inline-flex;align-items:center;height:19px;padding:0 6px;border-radius:5px;
  font-size:11px;font-weight:600;background:var(--card-3);color:var(--txt-2)}
.tag.g{background:var(--ok-soft);color:var(--ok)}
.tag.y{background:var(--warn-soft);color:var(--warn)}
.tag.r{background:var(--danger-soft);color:var(--danger)}
.tag.b{background:var(--brand-soft);color:var(--brand)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:0 0 6px;display:inline-block}
.dot.off{background:var(--txt-3)}
.dot.fail{background:var(--danger)}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);min-height:46px}
.li:last-child{border-bottom:0}
.li-main{flex:1;min-width:0}
.li-t{font-size:12.8px;font-weight:600;display:flex;align-items:center;gap:6px}
.li-s{font-size:11px;color:var(--txt-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:5px 0}
.kv .k{color:var(--txt-3)}
.kv .v{text-align:right;word-break:break-all}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;color:var(--txt-3);font-weight:600;padding:0 8px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);font-size:12.5px}
tr:last-child td{border-bottom:0}

pre.code{margin:0;background:var(--code);color:var(--code-fg);border:1px solid var(--line);border-radius:9px;
  padding:11px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.7;
  max-height:340px;overflow:auto;white-space:pre-wrap;word-break:break-all}

#term{background:var(--code);border:1px solid var(--line);border-radius:11px;overflow:hidden}
#termOut{min-height:260px;max-height:52vh;overflow-y:auto;padding:12px;font-family:ui-monospace,Menlo,monospace;
  font-size:12px;line-height:1.7;color:var(--code-fg);white-space:pre-wrap;word-break:break-all}
#termOut .cmd{color:#4ade80}
#termOut .err{color:#f87171}
.term-in{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line);background:var(--bg-soft)}
.term-in input{flex:1;height:34px;background:var(--code);border:1px solid var(--line);color:var(--code-fg);
  border-radius:7px;padding:0 10px;font-family:ui-monospace,monospace;font-size:12px;outline:none}
.term-in input:focus{border-color:#2a3a50}

.empty{text-align:center;padding:36px 16px;color:var(--txt-3);font-size:12.5px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));
  z-index:100;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:calc(100% - 30px);max-width:360px}
.toast{background:var(--card-2);border:1px solid var(--line-2);padding:9px 14px;border-radius:9px;
  font-size:12.5px;box-shadow:var(--shadow);animation:fade .2s}
.toast.ok{border-color:rgba(34,197,94,.4)}
.toast.err{border-color:rgba(240,82,82,.4)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.crumb{display:flex;align-items:center;gap:4px;font-size:11.5px;overflow-x:auto;white-space:nowrap;padding:2px 0}
.crumb span{cursor:pointer;color:var(--brand)}
.crumb i{color:var(--txt-3);font-style:normal}

/* 文件操作 */
.frow{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);min-height:48px}
.frow:last-child{border-bottom:0}
.frow .nm{flex:1;min-width:0;cursor:pointer}
.frow .nm b{display:block;font-size:12.8px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .nm > span{font-size:11px;color:var(--txt-3);display:block;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
@media(max-width:900px){
  .frow .nm > span{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
}
.fops{display:flex;gap:2px;opacity:.55;transition:.15s}
.frow:hover .fops{opacity:1}
@media(max-width:900px){.fops{opacity:1}}
.fops button{width:28px;height:28px;border:0;background:transparent;color:var(--txt-3);border-radius:7px;
  cursor:pointer;display:grid;place-items:center;font-size:14px}
.fops button:hover{background:var(--card-3);color:var(--txt)}

/* 全屏编辑器 */
#editor{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;background:var(--bg);
  display:none;flex-direction:column}
#editor.on{display:flex}
.ed-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);
  background:var(--bg-soft);padding-top:calc(10px + env(safe-area-inset-top,0px))}
.ed-h b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46%}
.ed-h .dim{font-size:11px}
#edText{flex:1;width:100%;border:0;outline:none;resize:none;background:var(--code);color:var(--code-fg);
  font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.65;padding:12px;
  -webkit-text-size-adjust:100%}
.ed-f{display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--line);
  background:var(--bg-soft);padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}

/* 端口探测 */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.pcell{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--card-2);font-size:11.5px}
.pcell.open{border-color:rgba(34,197,94,.35);background:var(--ok-soft)}
.pcell b{display:block;font-size:13px;font-family:ui-monospace,monospace}
.pcell span{color:var(--txt-3);font-size:10.5px}
.pcell.open span{color:var(--ok)}

/* 日志 */
.logbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:10px}
.logbar button{height:30px;padding:0 11px;border-radius:8px;border:1px solid var(--line);background:var(--card-2);
  color:var(--txt-2);font-size:12px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.logbar button.on{background:var(--brand-soft);border-color:rgba(77,141,255,.35);color:var(--brand);font-weight:600}
#logPre{max-height:none;height:calc(100vh - 300px);min-height:240px}
@media(max-width:900px){#logPre{height:calc(100vh - 330px)}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{height:30px;padding:0 12px;border:0;background:var(--card-2);color:var(--txt-2);font-size:12px;cursor:pointer}
.seg button.on{background:var(--brand-soft);color:var(--brand);font-weight:600}

@supports not (gap:1px){
  .row>*+*{margin-left:6px}
  .term-in>*+*{margin-left:6px}
}

/* ================= 文件管理扩展 ================= */
@media(max-width:900px){
  .ftool{gap:8px}
  .ftool .btn{height:44px;padding:0 16px;font-size:13.5px;border-radius:10px}
  .selbar .btn{height:38px}
  .frow{min-height:56px}
}
.fchk{position:relative}
/* 视觉 22px，点击热区扩到 44px，避免移动端点不中 */
.fchk::after{content:"";position:absolute;left:-11px;top:-11px;right:-11px;bottom:-11px}
.fbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ftool{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.ftool::-webkit-scrollbar{display:none}
.ftool .btn{flex:0 0 auto}
.frow.sel{background:var(--brand-soft)}
.fchk{width:22px;height:22px;border:1.5px solid var(--line-2);border-radius:6px;display:grid;place-items:center;
  flex:0 0 22px;color:transparent;font-size:12px;cursor:pointer}
.frow.sel .fchk{background:var(--brand);border-color:var(--brand);color:#fff}
.fmeta{font-size:11px;color:var(--txt-3)}
.selbar{position:sticky;top:54px;z-index:12;background:var(--bg);border-bottom:1px solid var(--line);
  margin:0 -18px;padding:8px 18px;display:flex;align-items:center;gap:8px}
@media(max-width:900px){.selbar{top:52px;margin:0 -12px;padding:8px 12px}}
.selbar .n{font-size:12px;color:var(--txt-2)}

/* 底部面板 */
#panel{position:fixed;left:0;right:0;bottom:0;top:0;z-index:78;display:none}
#panel.on{display:block}
#panel .pnl-bg{position:absolute;left:0;right:0;bottom:0;top:0;background:rgba(3,6,11,.55)}
#panel .pnl{position:absolute;left:0;right:0;bottom:0;max-height:88vh;background:var(--card);
  border-radius:16px 16px 0 0;border-top:1px solid var(--line-2);display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0px);animation:up .2s}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media(min-width:901px){
  #panel .pnl{left:auto;right:24px;bottom:24px;width:480px;border-radius:14px;border:1px solid var(--line-2);max-height:82vh}
}
.pnl-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.pnl-h b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pnl-b{padding:14px 16px;overflow-y:auto;flex:1}
.pnl-f{padding:10px 16px 12px;border-top:1px solid var(--line);display:flex;gap:8px}
.pnl-f .btn{flex:1}

/* 动作菜单 */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:80;display:none}
#sheet.on{display:block}
#sheet .sk-bg{position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(3,6,11,.55)}
#sheet .sk{position:relative;background:var(--card);border-radius:16px 16px 0 0;border-top:1px solid var(--line-2);
  padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));max-height:74vh;overflow-y:auto;animation:up .18s}
@media(min-width:901px){#sheet .sk{max-width:420px;margin:0 auto;border-radius:14px 14px 0 0}}
.sk-h{padding:12px 18px 8px;font-size:11.5px;color:var(--txt-3);border-bottom:1px solid var(--line);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sk-i{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 18px;cursor:pointer;font-size:13.5px}
.sk-i:active{background:var(--card-2)}
.sk-i .i{width:20px;text-align:center;color:var(--txt-2);font-size:14px}
.sk-i.danger{color:var(--danger)}
.sk-i.danger .i{color:var(--danger)}

/* 上传进度 */
#upbar{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:70;
  background:var(--card);border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);display:none}
#upbar.on{display:block}
@media(min-width:901px){#upbar{left:auto;right:20px;bottom:20px;width:380px}}
#upbar .t{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:6px}
#upbar .t b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}

/* 搜索 */
.searchbox{display:none;padding:10px 0 12px}
.searchbox.on{display:block}
.searchbox .row{gap:8px}

/* 回收站 / 分享 / 版本 列表 */
.mini{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);min-height:52px}
.mini:last-child{border-bottom:0}
.mini .m{flex:1;min-width:0}
.mini .m b{display:block;font-size:12.8px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .m span{font-size:11px;color:var(--txt-3);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini.dim{opacity:.5}

/* 搜索结果高亮 */
.hit-line{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--txt-2);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hit-line em{font-style:normal;background:rgba(245,166,35,.25);color:var(--warn);border-radius:3px;padding:0 1px}

/* 拖拽上传 */
#p-files.drop{outline:2px dashed var(--brand);outline-offset:-8px;border-radius:12px}
#p-files.drop::after{content:"松开上传到当前目录";position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  background:var(--card);border:1px solid var(--brand);color:var(--brand);padding:10px 18px;border-radius:10px;
  font-size:13px;z-index:60;pointer-events:none}

/* 空状态 */
.empty2{text-align:center;padding:42px 20px;color:var(--txt-3);font-size:12.5px;line-height:1.8}
</style>
</head>
<body>

<div id="login">
  <form class="login-card" id="loginForm">
    <div class="logo">P</div>
    <h1>PocketPanel</h1>
    <p>运行在 Termux 上的轻量服务器面板</p>
    <div class="field">
      <label>用户名</label>
      <input class="input" type="text" id="user" value="admin" placeholder="用户名" autocomplete="username" autocapitalize="off" spellcheck="false">
    </div>
    <div class="field">
      <label>密码</label>
      <input class="input" type="password" id="pwd" placeholder="请输入密码" autocomplete="current-password">
    </div>
    <div class="err" id="loginErr"></div>
    <button class="btn primary block" type="submit" id="loginBtn">登录</button>
  </form>
</div>

<div id="app">
  <div id="scrim"></div>
  <aside class="side" id="side">
    <div class="brand">
      <div class="brand-logo">P</div>
      <div><b>PocketPanel</b><span id="brandVer">v0.1.0</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="who" id="whoBtn">
        <div class="avatar" id="avatar">A</div>
        <div style="min-width:0"><b id="whoName">admin</b><span>账户设置</span></div>
      </div>
      <div class="row" style="gap:5px"><i class="dot" id="sideDot"></i><span id="sideState">连接中…</span></div>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <h1 id="title">概览</h1>
      <span class="spacer"></span>
      <button class="ico-btn" id="themeBtn" title="切换主题">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
      </button>
      <button class="ico-btn" id="logoutBtn" title="退出">
        <svg viewBox="0 0 24 24"><path d="M9 20H5a1.5 1.5 0 0 1-1.5-1.5v-13A1.5 1.5 0 0 1 5 4h4M15.5 16.5 20 12l-4.5-4.5M20 12H9"/></svg>
      </button>
    </header>

    <main class="content">
      <section class="page on" id="p-overview"></section>
      <section class="page" id="p-services"></section>
      <section class="page" id="p-processes"></section>
      <section class="page" id="p-files"></section>
      <section class="page" id="p-terminal"></section>
      <section class="page" id="p-network"></section>
      <section class="page" id="p-logs"></section>
      <section class="page" id="p-tasks"></section>
      <section class="page" id="p-settings"></section>
    </main>
  </div>

  <nav class="tabbar" id="tabbar">
    <button class="on" data-page="overview"><svg viewBox="0 0 24 24"><path d="M3 10.4 12 3l9 7.4V20a1 1 0 0 1-1 1h-5v-6.6H9V21H4a1 1 0 0 1-1-1z"/></svg>概览</button>
    <button data-page="services"><svg viewBox="0 0 24 24"><rect x="3" y="3.5" width="18" height="7" rx="1.8"/><rect x="3" y="13.5" width="18" height="7" rx="1.8"/></svg>服务</button>
    <button data-page="files"><svg viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2h8.5A1.5 1.5 0 0 1 21 9.5v9A1.5 1.5 0 0 1 19.5 20h-15A1.5 1.5 0 0 1 3 18.5z"/></svg>文件</button>
    <button data-page="terminal"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7.5 9.5 2.5 2.5-2.5 2.5M13 15h4"/></svg>终端</button>
    <button data-more="1"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>更多</button>
  </nav>
</div>

<div id="editor">
  <div class="ed-h">
    <b id="edName">file</b>
    <span class="dim" id="edInfo"></span>
    <span class="spacer"></span>
    <button class="btn sm ghost" id="edClose">关闭</button>
  </div>
  <textarea id="edText" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
  <div class="ed-f">
    <span class="dim" id="edBytes">0 字符</span>
    <span class="spacer"></span>
    <button class="btn sm" id="edReload">重新载入</button>
    <button class="btn sm primary" id="edSave">保存</button>
  </div>

<div id="panel"><div class="pnl-bg" onclick="closePanel()"></div><div class="pnl" id="panelBox"></div></div>
<div id="sheet"><div class="sk-bg" onclick="closeSheet()"></div><div class="sk" id="sheetBox"></div></div>
<div id="upbar"></div>
<input type="file" id="upInput" multiple style="display:none">
<div id="toast"></div>

<script>
var S={page:'overview',ov:null,timer:null,cwd:'',termHist:[],termCwd:'',theme:'dark',tasks:[],
  user:'',ver:'',proc:[],net:null,logs:[],logName:'',logLines:200,edPath:'',edName:''};

function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(msg,type){
  var w=$('#toast'), d=document.createElement('div');
  d.className='toast '+(type||'');
  d.textContent=msg; w.appendChild(d);
  setTimeout(function(){ d.style.opacity='0'; setTimeout(function(){ if(d.parentNode)d.parentNode.removeChild(d) },250) },2200);
}
function fmtB(n){
  n=n||0;
  if(n>=1073741824) return (n/1073741824).toFixed(1)+' GB';
  if(n>=1048576) return (n/1048576).toFixed(1)+' MB';
  if(n>=1024) return (n/1024).toFixed(0)+' KB';
  return n+' B';
}
function fmtDur(s){
  s=Math.floor(s||0);
  var d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60);
  if(s<60) return s+' 秒';
  if(d) return d+' 天 '+h+' 小时';
  if(h) return h+' 小时 '+m+' 分';
  return m+' 分钟';
}
function pct(n){ return Math.max(0,Math.min(100,Math.round(n||0))) }
function bytes(s){ return s?new Blob([s]).size:0 }

function api(path,opt){
  opt=opt||{};
  opt.credentials='same-origin';
  opt.headers=opt.headers||{};
  if(opt.body && typeof opt.body!=='string'){ opt.body=JSON.stringify(opt.body); opt.headers['Content-Type']='application/json' }
  return fetch(path,opt).then(function(r){
    // 登录接口的 401 是「凭据错误」，不能当成会话过期，否则会覆盖登录页的错误提示
    if(r.status===401 && path.indexOf('/api/login')!==0){ showLogin(); throw new Error('登录已过期') }
    return r.json().then(function(j){
      if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
      if(path.indexOf('/api/login')!==0) markOnline();
      return j;
    },function(){ markOffline('响应解析失败'); throw new Error('响应解析失败') })
  })
}

function markOnline(){
  var d=$('#sideDot'); if(d) d.className='dot';
  var s=$('#sideState');
  if(s) s.textContent='在线'+(S.ov?' · '+S.ov.procs+' 进程':'');
}
function markOffline(text){
  var d=$('#sideDot'); if(d) d.className='dot fail';
  var s=$('#sideState'); if(s) s.textContent=text||'连接失败';
}
function showLogin(){ $('#login').style.display='flex'; $('#app').classList.remove('on'); stopPoll(); closeSide() }
function showApp(){ $('#login').style.display='none'; $('#app').classList.add('on'); startPoll() }

function setUser(name){
  S.user=name||'admin';
  $('#whoName').textContent=S.user;
  $('#avatar').textContent=(S.user.charAt(0)||'A').toUpperCase();
}

$('#loginForm').addEventListener('submit',function(e){
  e.preventDefault();
  var u=($('#user').value||'').trim(), p=$('#pwd').value;
  if(!u){ $('#loginErr').textContent='请输入用户名'; return }
  if(!p){ $('#loginErr').textContent='请输入密码'; return }
  $('#loginBtn').disabled=true; $('#loginErr').textContent='';
  api('/api/login',{method:'POST',body:{username:u,password:p}}).then(function(d){
    setUser(d.username||u);
    showApp(); go('overview');
  }).catch(function(err){
    $('#loginErr').textContent=err.message||'登录失败';
  }).then(function(){ $('#loginBtn').disabled=false });
});

$('#logoutBtn').addEventListener('click',function(){
  api('/api/logout',{method:'POST'}).then(function(){ showLogin() })['catch'](function(){ showLogin() });
});

function applyTheme(t){
  S.theme=t;
  document.documentElement.setAttribute('data-theme',t);
  try{ localStorage.setItem('pp_theme',t) }catch(e){}
  var m=document.querySelector('meta[name=theme-color]');
  if(m) m.setAttribute('content',t==='dark'?'#080b11':'#f3f6fb');
  if(S.page==='overview' && S.ov) drawCpu();
  if(S.page==='settings') renderSettings();
}
$('#themeBtn').addEventListener('click',function(){ applyTheme(S.theme==='dark'?'light':'dark') });

/* ---------------- 导航 ---------------- */

var ICONS={
  overview:'<path d="M3 10.4 12 3l9 7.4V20a1 1 0 0 1-1 1h-5v-6.6H9V21H4a1 1 0 0 1-1-1z"/>',
  services:'<rect x="3" y="3.5" width="18" height="7" rx="1.8"/><rect x="3" y="13.5" width="18" height="7" rx="1.8"/><circle cx="6.8" cy="7" r=".9" fill="currentColor"/><circle cx="6.8" cy="17" r=".9" fill="currentColor"/>',
  processes:'<rect x="4" y="3.5" width="16" height="4" rx="1.4"/><rect x="4" y="10" width="16" height="4" rx="1.4"/><rect x="4" y="16.5" width="16" height="4" rx="1.4"/>',
  files:'<path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2h8.5A1.5 1.5 0 0 1 21 9.5v9A1.5 1.5 0 0 1 19.5 20h-15A1.5 1.5 0 0 1 3 18.5z"/>',
  terminal:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7.5 9.5 2.5 2.5-2.5 2.5M13 15h4"/>',
  network:'<path d="M2.5 8.5a14 14 0 0 1 19 0M5.5 12.2a10 10 0 0 1 13 0M9 15.8a5.5 5.5 0 0 1 6 0"/><circle cx="12" cy="19.2" r="1" fill="currentColor"/>',
  logs:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
  tasks:'<path d="M18 8.5a6 6 0 1 0-12 0c0 5-2 6.5-2 6.5h16s-2-1.5-2-6.5z"/><path d="M10 18.5a2.2 2.2 0 0 0 4 0"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1"/>'
};
var NAV=[
  ['overview','概览'],['services','服务'],['processes','进程'],
  ['files','文件'],['terminal','终端'],['network','网络'],
  ['logs','日志'],['tasks','任务'],['settings','设置']
];
var TITLES={};
(function(){
  var html='';
  for(var i=0;i<NAV.length;i++){
    TITLES[NAV[i][0]]=NAV[i][1];
    html+='<div class="nav-item'+(i===0?' on':'')+'" data-page="'+NAV[i][0]+'">'
      +'<svg viewBox="0 0 24 24">'+ICONS[NAV[i][0]]+'</svg>'+NAV[i][1]+'</div>';
  }
  $('#nav').innerHTML=html;
})();

function go(p){
  S.page=p;
  $$('.page').forEach(function(el){ el.classList.toggle('on', el.id==='p-'+p) });
  $$('.nav-item').forEach(function(el){ el.classList.toggle('on', el.dataset.page===p) });
  $$('#tabbar button').forEach(function(el){ el.classList.toggle('on', el.dataset.page===p) });
  $('#title').textContent=TITLES[p]||p;
  if(p==='overview') loadOverview();
  if(p==='services') loadServices();
  if(p==='processes') loadProcesses();
  if(p==='files') loadFiles(S.cwd||'');
  if(p==='terminal') renderTerminal();
  if(p==='network') loadNetwork();
  if(p==='logs') loadLogs();
  if(p==='tasks') loadTasks();
  if(p==='settings') renderSettings();
  closeSide();
  window.scrollTo(0,0);
}
document.addEventListener('click',function(e){
  var n=e.target.closest('[data-page]');
  if(n){ go(n.dataset.page); return }
  if(e.target.closest('[data-more]')){ openSide(); return }
});

/* ---------------- 侧栏 ---------------- */
function openSide(){ $('#side').classList.add('open'); $('#scrim').classList.add('on') }
function closeSide(){ $('#side').classList.remove('open'); $('#scrim').classList.remove('on') }
$('#scrim').addEventListener('click',closeSide);
$('#whoBtn').addEventListener('click',function(){ go('settings') });

/* ---------------- 概览 ---------------- */

function loadOverview(){
  var box=$('#p-overview');
  if(box && !box.firstChild) box.innerHTML='<div class="card"><div class="empty">读取设备状态…</div></div>';
  api('/api/overview').then(function(d){
    S.ov=d;
    renderOverview(d);
    $('#sideDot').className='dot';
    $('#sideState').textContent='在线 · '+(d.procs||0)+' 进程';
  }).catch(function(){
    $('#sideDot').className='dot fail';
    $('#sideState').textContent='连接失败';
  });
}
function ring(p,color){
  return '<div class="ring" style="--p:'+pct(p)+';--c:'+color+'"><span>'+pct(p)+'%</span></div>';
}
function renderOverview(d){
  var memP=d.mem_total?d.mem_used/d.mem_total*100:0;
  var diskP=d.disk_total?d.disk_used/d.disk_total*100:0;
  var html='<div class="grid g4" style="margin-bottom:12px">';
  html+='<div class="card"><div class="row between" style="margin-bottom:10px"><span class="dim" style="font-size:11.5px">CPU</span><span class="tag '+(d.cpu>75?'y':'g')+'">'+(d.cpu>75?'偏高':'正常')+'</span></div>'
    +'<div class="metric">'+ring(d.cpu,'var(--brand)')+'<div><div class="v">'+d.cpu.toFixed(1)+'%</div><div class="l">'+d.cores+' 核 · 8 秒采样</div></div></div></div>';
  html+='<div class="card"><div class="row between" style="margin-bottom:10px"><span class="dim" style="font-size:11.5px">内存</span><span class="tag">'+pct(memP)+'%</span></div>'
    +'<div class="metric">'+ring(memP,'var(--brand)')+'<div><div class="v">'+(d.mem_used/1073741824).toFixed(1)+' G</div><div class="l">共 '+(d.mem_total/1073741824).toFixed(1)+' G</div></div></div></div>';
  html+='<div class="card"><div class="row between" style="margin-bottom:10px"><span class="dim" style="font-size:11.5px">存储</span><span class="tag">'+pct(diskP)+'%</span></div>'
    +'<div class="metric">'+ring(diskP,'var(--ok)')+'<div><div class="v">'+(d.disk_used/1073741824).toFixed(0)+' G</div><div class="l">共 '+(d.disk_total/1073741824).toFixed(0)+' G</div></div></div></div>';
  html+='<div class="card"><div class="row between" style="margin-bottom:10px"><span class="dim" style="font-size:11.5px">电池</span><span class="tag '+(d.charging?'g':'')+'">'+(d.charging?'充电中':'放电')+'</span></div>'
    +'<div class="metric">'+ring(d.battery,'var(--warn)')+'<div><div class="v">'+d.battery+'%</div><div class="l">'+d.temp.toFixed(1)+' °C</div></div></div></div>';
  html+='</div>';

  html+='<div class="grid g2">';
  html+='<div class="card"><h3>设备<span>实时</span></h3>'
    +'<div class="kv"><span class="k">型号</span><span class="v">'+esc(d.model||'—')+'</span></div>'
    +'<div class="kv"><span class="k">系统</span><span class="v">Android '+esc(d.android||'—')+'</span></div>'
    +'<div class="kv"><span class="k">架构</span><span class="v mono">'+esc(d.arch)+'</span></div>'
    +'<div class="kv"><span class="k">运行时</span><span class="v mono">'+esc(d.go)+'</span></div>'
    +'<div class="kv"><span class="k">Go 可用核心</span><span class="v">'+(d.quota||d.cores)+' / '+d.cores+'</span></div>'
    +'<div class="kv"><span class="k">进程</span><span class="v">'+(d.running||0)+' 运行 / '+(d.procs||0)+' 总计</span></div>'
    +'<div class="kv"><span class="k">面板运行</span><span class="v">'+fmtDur(d.uptime)+'</span></div>'
    +'</div>';
  html+='<div class="card"><h3>CPU 趋势<span>最近 40 次</span></h3><div style="height:120px"><canvas id="cpuChart" style="width:100%;height:100%"></canvas></div>'
    +'<div class="row between" style="margin-top:8px;font-size:11px;color:var(--txt-3)"><span>0%</span><span>每 3 秒刷新</span><span id="cpuAxis">100%</span></div></div>';
  html+='</div>';

  html+='<div class="card" style="margin-top:12px"><h3>服务状态<span id="svcHint"></span></h3><div id="ovServices" class="list"><div class="empty">加载中…</div></div></div>';
  $('#p-overview').innerHTML=html;
  drawCpu();
  loadOvServices();
}
var cpuSeries=[];
function drawCpu(){
  var cv=$('#cpuChart'); if(!cv) return;
  if(S.ov){ cpuSeries.push(S.ov.cpu); if(cpuSeries.length>40) cpuSeries.shift() }
  var dpr=Math.min(window.devicePixelRatio||1,2);
  var r=cv.getBoundingClientRect();
  var w=Math.max(r.width,10), h=Math.max(r.height,10);
  cv.width=w*dpr; cv.height=h*dpr;
  var ctx=cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  var line=S.theme==='dark'?'#2a3a50':'#e3e9f2';
  ctx.strokeStyle=line; ctx.lineWidth=1;
  for(var i=0;i<=3;i++){ var y=h*i/3; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke() }
  if(cpuSeries.length<2){
    // 只有一个采样点时画一个点，避免看起来像图表没数据
    if(cpuSeries.length===1){
      ctx.beginPath(); ctx.arc(w-3,h-cpuSeries[0]/100*h,3,0,Math.PI*2);
      ctx.fillStyle=S.theme==='dark'?'#4d8dff':'#2563eb'; ctx.fill();
    }
    return;
  }
  var color=S.theme==='dark'?'#4d8dff':'#2563eb';
  var px=function(i){ return i/(cpuSeries.length-1)*w };
  // 低负载时固定 0-100 会让曲线贴底，按数据峰值自适应，最低 10%
  var peak=0;
  for(var m=0;m<cpuSeries.length;m++) if(cpuSeries[m]>peak) peak=cpuSeries[m];
  var axis=Math.max(10,Math.ceil(peak*1.3/10)*10);
  var py=function(v){ return h-Math.min(v,axis)/axis*h };
  var g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,S.theme==='dark'?'rgba(77,141,255,.35)':'rgba(37,99,235,.22)');
  g.addColorStop(1,'rgba(77,141,255,0)');
  ctx.beginPath(); ctx.moveTo(0,h);
  for(var k=0;k<cpuSeries.length;k++) ctx.lineTo(px(k),py(cpuSeries[k]));
  ctx.lineTo(w,h); ctx.closePath(); ctx.fillStyle=g; ctx.fill();
  ctx.beginPath();
  for(var j=0;j<cpuSeries.length;j++){ if(j)ctx.lineTo(px(j),py(cpuSeries[j])); else ctx.moveTo(px(j),py(cpuSeries[j])) }
  ctx.strokeStyle=color; ctx.lineWidth=2; ctx.stroke();
  var ax=$('#cpuAxis'); if(ax) ax.textContent=axis+'%';
}
function loadOvServices(){
  api('/api/services').then(function(list){
    var el=$('#ovServices'); if(!el) return;
    if(!list.length){ el.innerHTML='<div class="empty">没有 runit 服务</div>'; return }
    el.innerHTML=list.slice(0,6).map(function(s){

function fIcon(f){
  if(f.is_dir) return '▸';
  var n=f.name.toLowerCase();
  if(/\.(zip|tar|gz|tgz|xz|7z|rar)$/.test(n)) return '▣';
  if(/\.(sh|bash|zsh)$/.test(n)) return '$_';
  if(/\.(js|ts|json|go|py|php|rb|c|cpp|h|css|html|xml|yml|yaml|toml|conf|ini)$/.test(n)) return '<>';
  if(/\.(log|txt|md)$/.test(n)) return '≡';
  if(/\.(png|jpg|jpeg|gif|webp|svg|bmp)$/i.test(n)) return '▤';
  if(/\.(mp4|mkv|mov|avi|webm)$/i.test(n)) return '▶';
  if(/\.(mp3|flac|wav|ogg|m4a)$/i.test(n)) return '♪';
  return '·';
}

function fmtTime(ts){

  if(same) return p(d.getHours())+':'+p(d.getMinutes());
  return (d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}

function uploadQueue(files){
  if(F.uploading){ toast('已有上传任务在进行','err'); return }
  F.uploading=true; F.abortUp=false;
  var bar=$('#upbar'); bar.classList.add('on');
  var i=0, doneBytes=0;
  var totalBytes=files.reduce(function(a,f){return a+f.size},0);

  function next(){
    if(F.abortUp||i>=files.length){ finish(); return }
    var f=files[i];
    var label=files.length>1?('('+(i+1)+'/'+files.length+') '):'';
    bar.innerHTML='<div class="t"><b>'+esc(label+f.name)+'</b><span class="spacer"></span>'
      +'<span class="fmeta" id="upPct">0%</span></div>'
      +'<div class="bar"><i id="upFill" style="width:0"></i></div>'
      +'<div class="row" style="margin-top:8px"><span class="fmeta" id="upInfo">准备中…</span>'
      +'<span class="spacer"></span><button class="btn sm ghost" id="upCancel">取消</button></div>';
    $('#upCancel').onclick=function(){ F.abortUp=true; toast('已取消上传','info') };
    uploadOne(f,F.cwd,function(sent,total){
      var pct=total?Math.round(sent/total*100):0;
      var fill=$('#upFill'); if(fill) fill.style.width=pct+'%';
      var p=$('#upPct'); if(p) p.textContent=pct+'%';
      var info=$('#upInfo'); if(info) info.textContent=fmtB(sent)+' / '+fmtB(total)+' · 分片 '+(Math.ceil(sent/(1<<20)))+'/'+Math.ceil(total/(1<<20));
    }).then(function(){
      doneBytes+=f.size; i++; next();
    }).catch(function(e){
      toast(f.name+' 上传失败：'+e.message,'err');
      i++; next();
    });
  }
  function finish(){
    F.uploading=false;
    bar.classList.remove('on');
    if(doneBytes>0){ toast('上传完成','ok'); loadFiles(F.cwd) }
  }
  next();
}

// 单个文件的分片上传；中断后重新选择同名文件会从已传分片继续
function uploadOne(file,dir,onProgress){
  var CHUNK=1<<20;
  var key='ppup:'+dir+':'+file.name+':'+file.size+':'+file.lastModified;
  var saved='';
  try{ saved=localStorage.getItem(key)||'' }catch(e){}
  return api('/api/upload/init',{method:'POST',body:{
      path:dir,name:file.name,size:file.size,chunk_size:CHUNK,id:saved
    }}).then(function(init){
    try{ localStorage.setItem(key,init.id) }catch(e){}
    var uploaded=init.uploaded||[];
    var todo=[];
    for(var i=0;i<init.total;i++) if(uploaded.indexOf(i)<0) todo.push(i);
    var base=(init.total-todo.length)*init.chunk_size;
    var sent=0, k=0;
    onProgress(Math.min(base,file.size),file.size);

    function step(){
      if(F.abortUp) return Promise.reject(new Error('已取消'));
      if(k>=todo.length) return Promise.resolve();
      var idx=todo[k++];
      var start=idx*init.chunk_size, end=Math.min(start+init.chunk_size,file.size);
      var blob=file.slice(start,end);
      return fetch('/api/upload/'+init.id+'/'+idx,{
        method:'PUT',body:blob,credentials:'same-origin'
      }).then(function(r){
        if(r.status===401){ showLogin(); throw new Error('登录已过期') }
        if(!r.ok) return r.json().then(function(j){ throw new Error(j.error||('分片 '+idx+' 失败')) });
        sent+=blob.size;
        onProgress(Math.min(base+sent,file.size),file.size);
        return step();
      });
    }
    return step().then(function(){
      return api('/api/upload/'+init.id+'/complete',{method:'POST'});
    }).then(function(r){
      try{ localStorage.removeItem(key) }catch(e){}
      return r;
    });
  });
}

    path:F.cwd,q:q,sub:$('#fqsub').checked,limit:200,timeout_ms:8000,
    suffix:$('#fqsuffix')?$('#fqsuffix').value:''
  }}).then(function(t){

      F.searchDone=true;
      if(t2.status==='failed'){ F.hits=[]; F.searchErr=t2.output||'搜索失败'; renderFiles(); return }
      var r=t2.result||{};
      F.hits=r.hits||[]; F.truncated=!!r.truncated;
      renderFiles();
    });
  }).catch(function(e){ F.searchDone=true; F.hits=[]; toast(e.message,'err'); renderFiles() });
}

  reload.addEventListener('click',function(){ openEditor(S.edPath,S.edName) });
})();

// 通用单行输入面板
function askInput(title,def,cb){
  openPanel(title,
    '<div class="field"><label>名称</label><input class="input" id="askInput" value="'+esc(def||'')+'" autocapitalize="off" spellcheck="false"></div>',
    '<button class="btn ghost" style="flex:1" onclick="closePanel()">取消</button>'
    +'<button class="btn primary" style="flex:1" id="askOk">确定</button>');
  var inp=$('#askInput');
  setTimeout(function(){ inp.focus(); inp.select() },100);
  function done(ok){
    var v=(inp.value||'').trim();
    if(!ok) { closePanel(); return }
    if(!v){ toast('名称不能为空','err'); return }
    closePanel(); cb(v);
  }
  $('#askOk').onclick=function(){ done(true) };
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter') done(true) });
}

/* ---------------- 行菜单 ---------------- */

function fileMenu(name,isDir){
  var path=F.cwd.replace(/\/$/,'')+'/'+name;
  var items=[];
  if(!isDir){
    items.push({icon:'◐',label:'在线编辑',run:function(){ openEditor(path,name) }});
    if(isArchive(name)) items.push({icon:'⇲',label:'解压到当前目录',run:function(){ doExtract(name) }});
  }
  items.push({icon:'⇩',label:'下载',run:function(){ downloadFile(path) }});
  items.push({icon:'⇄',label:'重命名',run:function(){ renameEntry(name) }});
  items.push({icon:'⧉',label:'复制',run:function(){ F.clip={paths:[path],cut:false}; toast('已复制到剪贴板','ok'); renderFiles() }});
  items.push({icon:'✂',label:'剪切',run:function(){ F.clip={paths:[path],cut:true}; toast('已剪切','ok'); renderFiles() }});
  items.push({icon:'▣',label:'压缩',run:function(){ doArchive([path]) }});
  if(!isDir) items.push({icon:'↗',label:'分享链接',run:function(){ openShare(path,name) }});
  items.push({icon:'⟲',label:'历史版本',run:function(){ openVersions(path,name) }});
  items.push({icon:'⚿',label:'权限',run:function(){ openChmod(path,name) }});
  items.push({icon:'i',label:'属性',run:function(){ openStat(path,name) }});
  items.push({icon:'✕',label:'删除',danger:true,run:function(){ removeEntry(name,isDir) }});
  openSheet(name,items);
}

function downloadFile(path){
  var a=document.createElement('a');
  a.href='/api/file?download=1&path='+encodeURIComponent(path);
  a.download='';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

function renameEntry(name){
  askInput('重命名',name,function(nn){
    if(nn===name) return;
    api('/api/file/rename',{method:'POST',body:{path:F.cwd.replace(/\/$/,'')+'/'+name,name:nn}})
      .then(function(){ toast('已重命名','ok'); loadFiles(F.cwd) })
      .catch(function(e){ toast(e.message,'err') });
  });
}

function removeEntry(name,isDir){
  var path=F.cwd.replace(/\/$/,'')+'/'+name;
  api('/api/file?path='+encodeURIComponent(path),{method:'DELETE'}).then(function(r){
    toast((r.trashed?'已移入回收站：':'已删除：')+name,'ok');
    loadFiles(F.cwd);
  }).catch(function(e){ toast(e.message,'err') });
}

/* ---------------- 批量操作 ---------------- */

function batchAction(kind){
  var paths=selPaths();
  if(!paths.length) return;
  if(kind==='copy'||kind==='cut'){
    F.clip={paths:paths,cut:kind==='cut'};
    F.sel={}; renderFiles();
    toast('已'+(kind==='cut'?'剪切':'复制')+' '+paths.length+' 项，进入目标目录后点「粘贴」','ok');
    return;
  }
  if(kind==='zip'){ doArchive(paths); return }
  if(kind==='del'){
    if(!confirm('将 '+paths.length+' 项移入回收站？')) return;
    var done=0;
    paths.forEach(function(p){
      api('/api/file?path='+encodeURIComponent(p),{method:'DELETE'}).then(function(){
        if(++done===paths.length){ toast('已移入回收站 '+done+' 项','ok'); loadFiles(F.cwd) }
      }).catch(function(e){ toast(e.message,'err') });
    });
  }
}

function doPaste(){
  if(!F.clip) return;
  api('/api/file/copy',{method:'POST',body:{
    paths:F.clip.paths,dest:F.cwd,move:F.clip.cut
  }}).then(function(r){
    toast((F.clip.cut?'已移动 ':'已复制 ')+r.done+' 项'+(r.failed.length?'，失败 '+r.failed.length:''),'ok');
    if(r.failed.length) console.warn(r.failed);
    F.clip=null; loadFiles(F.cwd);
  }).catch(function(e){ toast(e.message,'err') });
}

/* ---------------- 压缩 / 解压 / 远程下载 ---------------- */

function doArchive(paths){
  if(!paths.length) return;
  var fmt=(prompt('压缩格式：输入 zip 或 tar.gz','zip')||'zip').trim();
  if(fmt!=='zip'&&fmt!=='tar.gz'){ toast('只支持 zip 或 tar.gz','err'); return }
  closePanel();
  api('/api/archive',{method:'POST',body:{paths:paths,format:fmt}}).then(function(t){
    toast('压缩任务已开始','ok');
    pollTask(t.id,function(t2){
      if(t2.status==='success'){ toast('压缩完成：'+(t2.result&&t2.result.dest?t2.result.dest.split('/').pop():''),'ok'); loadFiles(F.cwd) }
      else toast('压缩失败：'+(t2.output||'').split('\n').filter(Boolean).pop(),'err');
    });
  }).catch(function(e){ toast(e.message,'err') });
}

function doExtract(name){
  var path=F.cwd.replace(/\/$/,'')+'/'+name;
  var dest=F.cwd.replace(/\/$/,'')+'/'+name.replace(/\.(zip|tar\.gz|tgz|tar|gz|xz)$/i,'');
  api('/api/extract',{method:'POST',body:{path:path,dest:dest}}).then(function(t){
    toast('解压任务已开始','ok');
    pollTask(t.id,function(t2){
      if(t2.status==='success'){ toast('解压完成','ok'); loadFiles(F.cwd) }
      else toast('解压失败：'+(t2.output||'').split('\n').filter(Boolean).pop(),'err');
    });
  }).catch(function(e){ toast(e.message,'err') });
}

function remoteDownload(){
  openPanel('远程下载',
    '<div class="field"><label>文件 URL</label><input class="input mono" id="rdUrl" placeholder="https://example.com/file.tar.gz" autocapitalize="off"></div>'
    +'<div class="field"><label>保存到</label><input class="input mono" value="'+esc(F.cwd)+'" readonly></div>'
    +'<div class="field"><label>文件名（可选）</label><input class="input mono" id="rdName" placeholder="留空则从 URL 推断"></div>'
    +'<div class="fmeta">下载在后台进行，可以关闭面板去处理别的事。文件先写入 .part，完成后再改名。</div>',
    '<button class="btn ghost" style="flex:1" onclick="closePanel()">取消</button>'
    +'<button class="btn primary" style="flex:1" id="rdGo">开始下载</button>');
  $('#rdGo').onclick=function(){
    var u=$('#rdUrl').value.trim();
    if(!u){ toast('请输入 URL','err'); return }
    var btn=this; btn.disabled=true;
    api('/api/download/remote',{method:'POST',body:{url:u,dir:F.cwd,name:$('#rdName').value.trim()}})
      .then(function(t){
        closePanel();
        toast('下载任务已开始','ok');
        pollTask(t.id,function(t2){
          if(t2.status==='success'){
            toast('下载完成：'+(t2.result&&t2.result.path?t2.result.path.split('/').pop():''),'ok');
            loadFiles(F.cwd);
          }else if(t2.status==='failed'){
            toast('下载失败：'+(t2.output||'').split('\n').filter(Boolean).pop(),'err');
          }
        });
      }).catch(function(e){ toast(e.message,'err'); btn.disabled=false });
  };
}

/* ---------------- 历史版本 ---------------- */

function openVersions(path,name){
  api('/api/versions?path='+encodeURIComponent(path)).then(function(d){
    if(!d.versions.length){
      openPanel('历史版本 · '+name,'<div class="empty2">暂无历史版本<br><span style="font-size:11px">每次在面板内编辑并保存时，会自动保留旧内容</span></div>');
      return;
    }
    var html='<div class="fmeta" style="margin-bottom:8px">保留最近 '+d.keep+' 份。恢复前会把当前内容也存为一份版本。</div><div class="list">';
    d.versions.forEach(function(v){
      html+='<div class="mini"><div class="m"><b>'+fmtFull(v.ts)+'</b><span>'+fmtB(v.size)+'</span></div>'
        +'<button class="btn sm ghost" data-vread="'+v.id+'">查看</button>'
        +'<button class="btn sm" data-vrestore="'+v.id+'" data-vpath="'+esc(path)+'" data-vname="'+esc(name)+'">恢复</button></div>';
    });
    html+='</div>';
    openPanel('历史版本 · '+name,html);
  }).catch(function(e){ toast(e.message,'err') });
}

function fmtFull(ts){
  var d=new Date(ts*1000),p=function(x){return (x<10?'0':'')+x};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}

function versionRead(id){
  api('/api/versions/read?id='+encodeURIComponent(id)).then(function(d){
    openPanel('版本内容',
      '<pre class="code" style="max-height:56vh">'+esc(d.content)+'</pre>',
      '<button class="btn ghost" style="flex:1" onclick="closePanel()">关闭</button>');
  }).catch(function(e){ toast(e.message,'err') });
}

function versionRestore(id,path,name){

    toast('已恢复到该版本','ok'); closePanel(); loadFiles(F.cwd);
  }).catch(function(e){ toast(e.message,'err') });
}

function openShare(path,name){
  openPanel('分享 · '+name,
    '<div class="field"><label>有效期</label><div class="seg" id="shHours">'
      +'<button data-h="1">1 小时</button><button data-h="24" class="on">24 小时</button>'
      +'<button data-h="168">7 天</button><button data-h="720">30 天</button></div></div>'
    +'<div class="row between" style="padding:6px 0 12px"><div><div class="tiny" style="font-weight:600">需要提取码</div>'
      +'<div class="fmeta">生成 4 位提取码，防止链接被随意转发</div></div>'
      +'<button class="switch on blue" id="shCode" data-on="1"></button></div>'
    +'<div class="fmeta">链接只读、可随时撤销。目录需要先压缩再分享。</div>'
    +'<div id="shResult"></div>',
    '<button class="btn ghost" style="flex:1" onclick="closePanel()">关闭</button>'
    +'<button class="btn primary" style="flex:1" id="shGo">生成链接</button>');
  var hours=24;
  $('#shHours').onclick=function(e){
    var b=e.target.closest('[data-h]'); if(!b) return;
    hours=+b.dataset.h;
    $$('#shHours button').forEach(function(x){ x.classList.toggle('on',x===b) });
  };
  $('#shCode').onclick=function(){
    var on=this.dataset.on!=='1';
    this.dataset.on=on?'1':'0';
    this.classList.toggle('on',on);
    this.classList.toggle('blue',on);
  };
  $('#shGo').onclick=function(){
    var need=$('#shCode').dataset.on==='1';
    api('/api/shares',{method:'POST',body:{path:path,hours:hours,need_code:need}}).then(function(s){
      var url=location.origin+'/s/'+s.token;
      $('#shResult').innerHTML='<div class="notice" style="margin-top:12px;display:block">'
        +'<div class="mono" style="font-size:11.5px;word-break:break-all;color:var(--brand)">'+esc(url)+'</div>'
        +(s.code?'<div style="margin-top:6px;font-size:12px">提取码 <b class="mono" style="font-size:15px;letter-spacing:2px">'+esc(s.code)+'</b></div>':'')
        +'<div class="fmeta" style="margin-top:6px">到期：'+fmtFull(s.expires_at)+'</div>'
        +'<button class="btn sm" style="margin-top:8px" id="shCopy">复制链接</button></div>';
      $('#shCopy').onclick=function(){ copyText(url,'分享链接') };
    }).catch(function(e){ toast(e.message,'err') });
  };
}

    '<button class="btn ghost" style="flex:1" onclick="closePanel()">取消</button>'
    +'<button class="btn primary" style="flex:1" id="chGo">应用</button>');

    api('/api/file/chmod',{method:'POST',body:{path:path,mode:mode,recursive:rec}}).then(function(r){
      toast('已修改 '+r.changed+' 项权限','ok');
      closePanel(); loadFiles(F.cwd);
    }).catch(function(e){ toast(e.message,'err') });
  };

document.addEventListener('click',function(e){

  el=e.target.closest('[data-fdir]');
  if(el){ loadFiles(el.dataset.fdir); return }

  el=e.target.closest('[data-fsel]');
  if(el){ toggleSel(el.dataset.fsel); return }

  el=e.target.closest('[data-fselclear]');
  if(el){ F.sel={}; renderFiles(); return }

  el=e.target.closest('[data-fbatch]');
  if(el){ batchAction(el.dataset.fbatch); return }

  el=e.target.closest('[data-fpaste]');
  if(el){ doPaste(); return }

  el=e.target.closest('[data-freload]');
  if(el){ loadFiles(F.cwd); return }

  el=e.target.closest('[data-fup]');
  if(el){ pickFiles(); return }

  el=e.target.closest('[data-fnew]');
  if(el){
    openSheet('新建',[
      {icon:'▸',label:'文件夹',run:function(){ askInput('新建文件夹','名称',function(n){
        api('/api/file/mkdir',{method:'POST',body:{path:F.cwd,name:n}})
          .then(function(){ loadFiles(F.cwd) }).catch(function(e){ toast(e.message,'err') });
      })}},
      {icon:'·',label:'空文件',run:function(){ askInput('新建文件','例如 config.json',function(n){
        api('/api/file/touch',{method:'POST',body:{path:F.cwd,name:n}})
          .then(function(r){ loadFiles(F.cwd); openEditor(r.path,n) })
          .catch(function(e){ toast(e.message,'err') });
      })}},
      {icon:'⇩',label:'远程下载',run:remoteDownload}
    ]);
    return;
  }

  el=e.target.closest('[data-fsearch]');
  if(el){
    F.searchOn=!F.searchOn;
    // 关闭搜索面板时同时退出结果视图，否则列表回不到目录内容
    if(!F.searchOn){ F.searching=false; F.hits=[]; }
    renderFiles();
    if(F.searchOn) setTimeout(function(){ var q=$('#fq'); if(q) q.focus() },80);
    return;
  }

  el=e.target.closest('[data-fdo]');
  if(el){ doSearch(); return }

  el=e.target.closest('[data-fmore]');
  if(el){ moreMenu(); return }

  el=e.target.closest('[data-fmenu]');
  if(el){ fileMenu(el.dataset.fmenu, el.dataset.isdir==='1'); return }

  el=e.target.closest('[data-fopenpath]');
  if(el){
    var pp=el.dataset.fopenpath;
    if(el.dataset.isdir==='1'){ loadFiles(pp) }
    else { openEditor(pp, pp.split('/').pop()) }
    return;
  }

  el=e.target.closest('[data-fopen]');
  if(el){
    var name=el.dataset.fopen;
    if(el.dataset.isdir==='1'){ loadFiles(F.cwd.replace(/\/$/,'')+'/'+name) }
    else { openEditor(F.cwd.replace(/\/$/,'')+'/'+name,name) }
    return;
  }

  el=e.target.closest('[data-trrestore]');
  if(el){ trashRestore(el.dataset.trrestore); return }

  el=e.target.closest('[data-trpurge]');
  if(el){ trashPurge(el.dataset.trpurge); return }

  el=e.target.closest('[data-trsave]');
  if(el){
    var days=+$('#trDays').value;
    api('/api/file-settings',{method:'POST',body:{trash_keep_days:days,version_keep:10}})
      .then(function(){ toast('已保存，保留 '+days+' 天','ok') })
      .catch(function(e){ toast(e.message,'err') });
    return;
  }

  el=e.target.closest('[data-vread]');
  if(el){ versionRead(el.dataset.vread); return }

  el=e.target.closest('[data-vrestore]');
  if(el){ versionRestore(el.dataset.vrestore, el.dataset.vpath, el.dataset.vname); return }

  el=e.target.closest('[data-shrevoke]');
  if(el){
    if(!confirm('撤销该分享？链接会立即失效。')) return;
    api('/api/shares/revoke',{method:'POST',body:{token:el.dataset.shrevoke}})
      .then(function(){ toast('已撤销','ok'); openShareList() })
      .catch(function(e){ toast(e.message,'err') });
    return;
  }

  el=e.target.closest('[data-fgoto]');
  if(el){ closePanel(); loadFiles(el.dataset.fgoto); return }
});

/* ---------------- 终端 ---------------- */

function renderTerminal(){
  $('#p-terminal').innerHTML='<div class="card" style="padding:0">'
    +'<div id="term"><div id="termOut"></div>'
    +'<div class="term-in"><input id="termInput" placeholder="输入命令，回车执行" autocomplete="off" autocapitalize="off" spellcheck="false">'
    +'<button class="btn primary sm" id="termSend" style="height:34px">运行</button></div></div></div>'
    +'<div class="row" style="margin-top:10px;gap:8px"><span class="dim" style="font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">工作目录 '+esc(termDir()||'~')+'</span>'
    +'<span class="spacer"></span><button class="btn sm ghost" id="termGoFiles">在文件页打开</button></div>';
  var out=$('#termOut');
  out.innerHTML=S.termHist.join('');
  out.scrollTop=out.scrollHeight;
  var inp=$('#termInput');
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ runCmd(inp.value); inp.value='' } });
  $('#termSend').onclick=function(){ runCmd(inp.value); inp.value='' };
  var gf=$('#termGoFiles');
  if(gf) gf.onclick=function(){ loadFiles(termDir()); go('files') };
  inp.focus();
}
function termLine(s,cls){
  S.termHist.push('<div class="'+(cls||'')+'">'+esc(s)+'</div>');
  if(S.termHist.length>200) S.termHist.shift();
  var o=$('#termOut');
  if(o){ o.innerHTML=S.termHist.join(''); o.scrollTop=o.scrollHeight }
}
function termDir(){ return S.termCwd || F.cwd || S.cwd || '' }
function runCmd(cmd){
  if(!cmd||!cmd.trim()) return;
  termLine('$ '+cmd,'cmd');
  api('/api/exec',{method:'POST',body:{cmd:cmd,cwd:termDir()}}).then(function(t){
    pollTask(t.id,function(t2){
      termLine(t2.output||'(无输出)', t2.status==='failed'?'err':'');
    });
  }).catch(function(e){ termLine('执行失败：'+e.message,'err') });
}
function pollTask(id,cb){
  var tries=0;
  var tick=function(){
    api('/api/exec/'+id).then(function(t){
      if(t.status==='running'&&tries++<200){ setTimeout(tick,400); return }
      cb(t);
    }).catch(function(e){ cb({output:'轮询失败：'+e.message,status:'failed'}) });
  };
  setTimeout(tick,300);
}

/* ---------------- 网络 ---------------- */

function loadNetwork(){
  $('#p-network').innerHTML='<div class="card"><div class="empty">探测中…</div></div>';
  api('/api/network').then(function(d){
    S.net=d;
    var html='<div class="grid g2" style="margin-bottom:12px">';
    (d.ifaces||[]).forEach(function(f){
      html+='<div class="card"><h3>'+esc(f.name)+'<span>'+(f.flags&&f.flags.indexOf('UP')>=0?'已启用':'未启用')+'</span></h3>'
        +'<div class="kv"><span class="k">IPv4</span><span class="v mono">'+esc(f.addr||'—')+'</span></div>'
        +'<div class="kv"><span class="k">MAC</span><span class="v mono">'+esc(f.mac||'系统限制不可读')+'</span></div>'
        +'<div class="kv"><span class="k">MTU</span><span class="v mono">'+esc(f.mtu||'—')+'</span></div>'
        +'</div>';
    });
    if(!(d.ifaces||[]).length) html+='<div class="card"><div class="empty">未读到网络接口</div></div>';
    html+='</div>';

    html+='<div class="card"><h3>本地端口探测<span>'+(d.ports||[]).filter(function(p){return p.open}).length+' 个开放</span></h3>';
    html+='<div class="pgrid">';
    (d.ports||[]).forEach(function(p){
      html+='<div class="pcell'+(p.open?' open':'')+'"><b>'+p.port+'</b><span>'+esc(p.hint||'')+(p.open?' · 开放':' · 关闭')+'</span></div>';
    });
    html+='</div>';
    html+='<div class="dim" style="font-size:11px;margin-top:10px">Android 限制普通应用读取 <span class="mono">/proc/net</span>，因此无法直接列出监听端口。这里改为对 127.0.0.1 的常用端口发起 TCP 连接探测，结果反映实际可连性。</div>';
    html+='<div style="margin-top:10px"><button class="btn sm" id="reprobe">重新探测</button></div></div>';
    $('#p-network').innerHTML=html;
    $('#reprobe').onclick=loadNetwork;
  }).catch(function(e){
    $('#p-network').innerHTML='<div class="card"><div class="empty">读取失败：'+esc(e.message)+'</div></div>';
  });
}

/* ---------------- 日志 ---------------- */

function loadLogs(){
  api('/api/logs').then(function(list){
    S.logs=list||[];
    if(!S.logs.length){
      $('#p-logs').innerHTML='<div class="card"><div class="empty">没有日志目录<br><span style="font-size:11px">$PREFIX/var/log/sv 为空</span></div></div>';
      return;
    }
    if(!S.logName || !S.logs.some(function(x){return x.name===S.logName})) S.logName=S.logs[0].name;
    var bar=S.logs.map(function(x){
      return '<button class="'+(x.name===S.logName?'on':'')+'" data-log="'+esc(x.name)+'">'+esc(x.name)
        +'<span class="dim" style="font-size:10px;margin-left:4px">'+fmtB(x.size)+'</span></button>';
    }).join('');
    $('#p-logs').innerHTML='<div class="logbar">'+bar+'</div>'
      +'<div class="card"><h3>'+esc(S.logName)+'<span id="logMeta">读取中…</span></h3>'
      +'<pre class="code" id="logPre">加载中…</pre>'
      +'<div class="row" style="margin-top:10px;gap:6px"><span class="dim" style="font-size:11px">行数</span>'
      +'<div class="seg" id="logSeg">'
      +[100,200,500,1000].map(function(n){ return '<button data-lines="'+n+'" class="'+(n===S.logLines?'on':'')+'">'+n+'</button>' }).join('')
      +'</div><span class="spacer"></span><button class="btn sm" id="logReload">刷新</button></div></div>';
    tailLog();
    $$('#logSeg button').forEach(function(b){
      b.onclick=function(){ S.logLines=+b.dataset.lines; loadLogs() };
    });
    $('#logReload').onclick=tailLog;
  }).catch(function(e){
    $('#p-logs').innerHTML='<div class="card"><div class="empty">读取失败：'+esc(e.message)+'</div></div>';
  });
}
function tailLog(){
  if(!S.logName) return;
  api('/api/logs/'+encodeURIComponent(S.logName)+'?lines='+S.logLines).then(function(d){
    var pre=$('#logPre'); if(!pre) return;
    pre.textContent=(d.lines||[]).join('\n')||'(空)';
    pre.scrollTop=pre.scrollHeight;
    var m=$('#logMeta');
    if(m) m.textContent=(d.lines||[]).length+' 行 · '+fmtB(d.size)+(d.truncated?' · 已截断':'');
  }).catch(function(e){
    var pre=$('#logPre'); if(pre) pre.textContent='读取失败：'+e.message;
  });
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-log]');
  if(!b) return;
  S.logName=b.dataset.log;
  loadLogs();
});

/* ---------------- 任务 ---------------- */

function loadTasks(){
  api('/api/tasks').then(function(list){
    S.tasks=list;
    if(!list.length){
      $('#p-tasks').innerHTML='<div class="card"><div class="empty">暂无任务<br><span style="font-size:11px">在终端执行命令后，任务会记录在这里</span></div></div>';
      return;
    }
    var html='<div class="card"><h3>任务<span>'+list.length+' 条</span></h3><div class="list">';
    list.forEach(function(t){
      var cls=t.status==='success'?'g':t.status==='failed'?'r':'y';
      var name=t.status==='success'?'已完成':t.status==='failed'?'失败':'运行中';
      html+='<div class="li" style="align-items:flex-start"><i class="dot '+(t.status==='success'?'':t.status==='failed'?'fail':'off')+'" style="margin-top:6px"></i>'
        +'<div class="li-main"><div class="li-t">'+esc(t.cmd)+'</div>'
        +'<div class="li-s">'+new Date(t.started*1000).toLocaleTimeString()+' · 退出码 '+t.exit+'</div>'
        +(t.output?'<pre class="code" style="margin-top:8px;max-height:140px;font-size:11px">'+esc(t.output)+'</pre>':'')
        +'</div><span class="tag '+cls+'">'+name+'</span></div>';
    });
    html+='</div></div>';
    $('#p-tasks').innerHTML=html;
  }).catch(function(e){
    $('#p-tasks').innerHTML='<div class="card"><div class="empty">读取失败：'+esc(e.message)+'</div></div>';
  });
}

/* ---------------- 设置（账户） ---------------- */

function renderSettings(){
  var port=location.port||'80';
  var html='<div class="grid g2">';
  html+='<div class="card"><h3>账户<span>当前登录 '+esc(S.user)+'</span></h3>'
    +'<div class="field"><label>用户名</label><input class="input" id="setUser" value="'+esc(S.user)+'" autocapitalize="off" spellcheck="false">'
    +'<div class="dim" style="font-size:11px">2–32 字符，不能包含空格、冒号、斜杠</div></div>'
    +'<div class="field"><label>当前密码</label><input class="input" type="password" id="setOld" placeholder="修改前需验证" autocomplete="current-password"></div>'
    +'<div class="field"><label>新密码</label><input class="input" type="password" id="setNew" placeholder="留空则不修改，至少 6 位" autocomplete="new-password"></div>'
    +'<div class="err" id="setErr"></div>'
    +'<button class="btn primary block" id="saveAcct">保存账户</button>'
    +'<div class="dim" style="font-size:11px;margin-top:8px">保存后其他设备的登录状态会失效，当前会话自动续期。</div></div>';

  html+='<div class="card"><h3>面板信息</h3>'
    +'<div class="kv"><span class="k">版本</span><span class="v mono">'+esc(S.ver||'0.1.0')+'</span></div>'
    +'<div class="kv"><span class="k">当前访问</span><span class="v mono">'+esc(location.host)+'</span></div>'
    +'<div class="kv"><span class="k">服务端口</span><span class="v mono">8888</span></div>'
    +'<div class="kv"><span class="k">登录用户</span><span class="v">'+esc(S.user)+'</span></div>'
    +'<div class="kv"><span class="k">会话有效期</span><span class="v">24 小时</span></div>'
    +'<div class="kv"><span class="k">主题</span><span class="v">'+(S.theme==='dark'?'深色':'浅色')+'</span></div>'
    +'<div class="row" style="margin-top:12px;gap:6px"><button class="btn sm" id="themeSwitch">切换主题</button>'
    +'<button class="btn sm ghost" id="logout2">退出登录</button></div></div>';
  html+='</div>';

  html+='<div class="card" style="margin-top:12px"><h3>安全建议</h3>'
    +'<div class="kv"><span class="k">初始密码</span><span class="v">首次启动生成，已存于 config.json</span></div>'
    +'<div class="kv"><span class="k">密码存储</span><span class="v mono">SHA-256 + 随机盐</span></div>'
    +'<div class="kv"><span class="k">传输</span><span class="v">明文 HTTP，仅建议局域网使用</span></div>'
    +'<div class="dim" style="font-size:11px;margin-top:8px">若需公网访问，请在前面加一层 HTTPS 反向代理，或通过 SSH 隧道访问。</div></div>';

  $('#p-settings').innerHTML=html;
  $('#saveAcct').onclick=saveAccount;
  $('#themeSwitch').onclick=function(){ applyTheme(S.theme==='dark'?'light':'dark') };
  $('#logout2').onclick=function(){ api('/api/logout',{method:'POST'}).then(function(){ showLogin() }) };
  var nu=$('#setUser');
  nu.addEventListener('keydown',function(e){ if(e.key==='Enter') saveAccount() });
}
function saveAccount(){
  var btn=$('#saveAcct'), err=$('#setErr');
  var username=($('#setUser').value||'').trim();
  var old=$('#setOld').value, pw=$('#setNew').value;
  err.textContent='';
  if(!old){ err.textContent='请输入当前密码'; return }
  if(pw && pw.length<6){ err.textContent='新密码至少 6 位'; return }
  btn.disabled=true;
  api('/api/passwd',{method:'POST',body:{old_password:old,username:username,password:pw}}).then(function(d){
    setUser(d.username||username);
    toast('账户已更新','ok');
    renderSettings();
  }).catch(function(e){
    err.textContent=e.message;
  }).then(function(){ btn.disabled=false });
}

/* ---------------- 轮询与启动 ---------------- */

function startPoll(){
  stopPoll();
  S.timer=setInterval(function(){
    if(S.page==='overview') loadOverview();
  },3000);
}
function stopPoll(){ if(S.timer){ clearInterval(S.timer); S.timer=null } }

window.addEventListener('resize',function(){ if(S.page==='overview') drawCpu() });

(function init(){
  var t='dark';
  try{ t=localStorage.getItem('pp_theme')||'dark' }catch(e){}
  applyTheme(t);
  api('/api/session').then(function(d){
    setUser(d.username||'admin');
    S.ver=d.version||'';
    var bv=$('#brandVer'); if(bv&&d.version) bv.textContent='v'+d.version;
    showApp(); go('overview'); loadOverview();
  }).catch(function(){ showLogin() });
})();
</script>
